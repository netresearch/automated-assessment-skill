# Managed by netresearch/.github/templates/skill/
# Drift from the template is blocking CI in this repo (check-template-drift.yml).
# Record explicit exceptions under intentional-drift[] to unblock.
#
# CodeQL runs as the `codeql` job of security.yml (advanced setup). CodeQL
# default setup must stay disabled in the repository settings, or GitHub
# refuses that job's uploads, and the repo ships no separate codeql.yml,
# which would analyse everything twice. Scorecard (scorecard.yml) is separate
# and IS templated.
#
# Common opt-ins for skill repos (list the file here so the template sync
# stops managing it, then customize it in-repo):
#   - .github/workflows/validate-agents.yml  (only for skills that ship an
#     AGENTS.md generator under skills/<name>/scripts; the reusable's
#     scripts-path input is repo-specific so this is never byte-identical)
template: skill
intentional-drift:
  # Runs the shared validator with `shellcheck-severity: style`, the level the
  # pre-commit hook uses; the template passes no severity (the reusable's
  # default, error) until it raises the level for every skill repository.
  - path: .github/workflows/lint.yml
    reason: shellcheck-severity style, stricter than the template default
