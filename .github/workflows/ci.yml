name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  ci:
    uses: netresearch/skill-repo-skill/.github/workflows/ci-python.yml@main
    permissions:
      contents: read
    with:
      python-versions: '["3.12"]'
      test-command: |
        echo "=== Validating shell script syntax ==="
        bash -n skills/automated-assessment/scripts/run-checkpoints.sh

        echo "=== Validating template checkpoint ==="
        f="skills/automated-assessment/assets/skill-template/checkpoints.yaml"
        grep -q "^version: 1" "$f" || { echo "Missing version: 1 in template"; exit 1; }
        grep -q "^skill_id:" "$f" || { echo "Missing skill_id in template"; exit 1; }
        grep -q "^mechanical:" "$f" || { echo "Missing mechanical section in template"; exit 1; }
        echo "Template checkpoint valid"

        echo "=== Validating SKILL.md body size ==="
        # The word cap this step used to enforce was retired in
        # netresearch/skill-repo-skill 5de586c (2026-08-21) and replaced by a
        # 500-body-line cap. Counting words over the whole file also charged
        # frontmatter to a budget meant for the body: a longer allowed-tools
        # line alone failed this job in #82 with no prose added.
        # Same formula as validate-skill.sh, which is the authority.
        for f in skills/*/SKILL.md; do
          lines=$(awk 'BEGIN{d=0} /^---$/{d++; next} d>=2{print}' "$f" | wc -l)
          if [ "$lines" -gt 500 ]; then
            echo "ERROR: $f body is $lines lines (max 500) - move reference material into references/"
            exit 1
          fi
          echo "OK: $f ($lines body lines)"
        done
