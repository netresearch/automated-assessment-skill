# Checkpoints for my-skill
# This file is auto-discovered by the extension-assessment skill
#
# Schema version: 1
# See: ~/.claude/skills/extension-assessment/references/checkpoints-schema.md

version: 1
skill_id: my-skill-name

# Preconditions gate the entire skill. If any precondition fails, every
# checkpoint in this file is skipped (see automated-assessment runner).
# Customize these for your skill — the defaults below assume a Composer
# project with at least one PHP source file (matches MS-04 / MS-05).
preconditions:
  - type: file_exists
    target: composer.json
    desc: "Project must be a Composer project"
  - type: command
    # `-prune` short-circuits descent into vendor/.git rather than just
    # filtering matches, and `-print -quit` stops at the first hit — keeps
    # the precondition cheap on large repos.
    pattern: "find . '(' -path './vendor' -o -path './.git' -o -path './node_modules' ')' -prune -o -name '*.php' -type f -print -quit | grep -q ."
    desc: "Project must contain at least one .php source file (skips metadata-only composer projects)"

mechanical:
  # File existence checks
  - id: MS-01
    type: file_exists
    target: README.md
    severity: error
    desc: "README.md must exist"

  # Content checks (literal string)
  - id: MS-02
    type: contains
    target: README.md
    pattern: "## Installation"
    severity: warning
    desc: "README should have Installation section"

  # Regex checks (supports globs)
  - id: MS-03
    type: regex
    target: .github/workflows/*.yml
    pattern: "runs-on:"
    severity: error
    desc: "Workflow must specify runner"

  # JSON path checks
  - id: MS-04
    type: json_path
    target: composer.json
    pattern: '.require["php"]'
    severity: error
    desc: "composer.json must specify PHP version"

  # Command checks
  - id: MS-05
    type: command
    pattern: "composer validate --strict"
    severity: error
    desc: "composer.json must be valid"

  # Verification / claims checks — evidence before assertion. Adapted from
  # the automated-assessment skill's references/verification-patterns.md
  # (patterns 1 and 2); see that catalog for more (release-workflow green,
  # dry-run artifacts, claim-substantiation rubric).
  - id: MS-06
    type: command
    # gh resolves {owner}/{repo} from the local origin remote. Counts a
    # successful run on any branch — the scripted runner accepts only
    # single-line patterns without $(...) command substitution, so the
    # default branch is not resolved here; tighten with
    # ?branch=<your-default-branch> if needed. The `if .workflow_runs[0]`
    # guard returns false on repos with no runs, so `fromdateiso8601` is
    # never handed a null (which would abort the filter); no runs -> fails.
    # yamllint disable-line rule:line-length
    pattern: 'gh api "repos/{owner}/{repo}/actions/runs?status=success&per_page=1" --jq "if .workflow_runs[0] then (.workflow_runs[0].updated_at | fromdateiso8601 | (now - .) < 86400) else false end" | grep -q true'
    severity: error
    desc: "Repository must have a successful CI run within the last 24 hours"

  - id: MS-07
    type: command
    # Customize build/logs/junit.xml to your project's test-report path.
    # find -mtime -1 is portable across GNU and BSD find.
    pattern: 'find build/logs/junit.xml -maxdepth 0 -mtime -1 2>/dev/null | grep -q .'
    severity: warning
    desc: "Test report must exist and be <24h old"

llm_reviews:
  # Subjective checks requiring LLM judgment
  - id: MS-10
    domain: repo-health
    rubric: references/llm-rubric.md#structure-check
    severity: warning
    desc: "Verify documentation structure follows standards"

  # Inline prompt (alternative to rubric file)
  - id: MS-11
    domain: code-quality
    prompt: |
      Check if the code follows these patterns:
      1. Uses dependency injection
      2. Has type declarations
      3. Follows PSR-12
    severity: info
    desc: "Code should follow modern PHP patterns"
